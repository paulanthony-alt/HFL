# Puts the test copy (test-site/) online at its own Firebase preview address. Never touches the
# real app: it deploys only to the "test" preview channel, and the copy reads/writes only its own
# test_… Firestore collections.
name: Deploy test site

on:
  push:
    branches: [main, claude/hfl-pickup-football-app-rrsp7j]
    paths: ['test-site/**', '.github/workflows/deploy-test-site.yml']
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: test-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Deploy to the test preview channel
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/key.json")
          npx --yes firebase-tools@15 hosting:channel:deploy test --expires 30d --project "$PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/out.json"
          cat "$RUNNER_TEMP/out.json"
          URL=$(jq -r '.result | to_entries[0].value.url' "$RUNNER_TEMP/out.json")
          echo "### 🧪 Test site: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Test site: $URL"
