# Puts the app live on Firebase Hosting and updates the Firestore security rules.
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the whole JSON key file from
# Firebase → Project settings → Service accounts → Generate new private key.
# Without the secret, this workflow just runs the tests and skips the deploy.
name: Deploy to Firebase

on:
  push:
    branches: [main, claude/hfl-pickup-football-app-rrsp7j]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          PROJECT_ID=$(jq -r .project_id "$RUNNER_TEMP/key.json")
          npx --yes firebase-tools@15 deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive
          echo "### 🏈 Live at https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
      - name: Skipped deploy
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT secret to deploy (see README → Firebase)."
