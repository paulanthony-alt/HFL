<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HFL">
  <title>HFL</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="preload" href="/fonts/big-shoulders-display-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <a href="#/" class="brand" aria-label="HFL home">
      <span class="logo"><span>HFL</span></span>
      <span class="crew" id="crew-name"></span>
    </a>
    <div class="top-right">
      <span class="live-dot" id="live-dot" title="Live sync"></span>
      <a href="#/me" class="me-pill" id="me-pill">Who are you?</a>
      <a href="#/settings" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </div>
  </header>

  <main id="view" class="view">
    <div class="boot" role="status" aria-label="Loading">
      <div class="boot-mark">HFL</div>
      <div class="boot-bar"><span></span></div>
      <p class="boot-text">Warming up</p>
    </div>
  </main>

  <nav class="tabs" id="tabs" aria-label="Main">
    <a href="#/" data-tab="game">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="5.6" transform="rotate(-45 12 12)"/><path d="M9.2 14.8l5.6-5.6M10.3 11.6l2.1 2.1M11.6 10.3l2.1 2.1"/></svg>
      <span>Game</span>
    </a>
    <a href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18M6.5 17V11M12 17V5.5M17.5 17V8.5"/></svg>
      <span>Stats</span>
    </a>
    <a href="#/cards" data-tab="cards">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2.8" width="11.5" height="15.5" rx="2"/><path d="M5 6.8v12.4a2 2 0 0 0 2 2h9"/><path d="M11.5 13.5l2.2-5 2.3 5"/></svg>
      <span>Cards</span>
    </a>
    <a href="#/plays" data-tab="plays">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17.5" r="2.8"/><path d="M15.5 3.5l4.5 4.5M20 3.5L15.5 8"/><path d="M8.6 15.6c3.4-1.4 5.8-4 6.8-7.3" stroke-dasharray="2.2 2.4"/></svg>
      <span>Plays</span>
    </a>
    <a href="#/wall" data-tab="wall">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-6 4.5z"/><path d="M8 9h8M8 12.3h5"/></svg>
      <span>Wall</span>
    </a>
    <a href="#/fame" data-tab="fame">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 5.5H5a3 3 0 0 0 3.3 4.4M16 5.5h3a3 3 0 0 1-3.3 4.4M12 13v3.5M8.5 20.5h7M9.5 16.5h5v4h-5z"/></svg>
      <span>Fame</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
